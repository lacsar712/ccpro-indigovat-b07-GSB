services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: indigovat
      POSTGRES_USER: indigovat
      POSTGRES_PASSWORD: indigovat
    ports:
      - "6460:5432"
    volumes:
      - indigovat_5060_6460_pg:/var/lib/postgresql/data
    # 首次 initdb 时频繁 healthcheck 会卡住临时库关停，故改为仅等容器启动
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U indigovat -d indigovat"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 36
    #   start_period: 90s

  web:
    build: .
    ports:
      # 5060 被 Chrome/Edge 列为不安全端口，主机侧改绑 5160
      - "5160:4720"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: indigovat
      POSTGRES_USER: indigovat
      POSTGRES_PASSWORD: indigovat
      SESSION_SECRET: "dev-indigovat-session-secret"
    depends_on:
      - db

volumes:
  indigovat_5060_6460_pg:
